<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travian AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="header-inner">
        <h1>⚔️ Travian AI</h1>
        <p>מערכת חכמה לניהול וניתוח חשבון Travian</p>
        <div class="status">🟢 מערכת פעילה</div>
    </div>
</header>

<main>

    <!-- DASHBOARD -->

    <section class="card">

        <h2>📊 תמונת מצב</h2>

        <div class="grid">

            <div class="field">
                <label>🏰 כפרים</label>
                <input id="villageCount" value="0" readonly>
            </div>

            <div class="field">
                <label>👥 אוכלוסייה</label>
                <input id="populationTotal" value="0" readonly>
            </div>

            <div class="field">
                <label>⚔️ חיילים</label>
                <input id="troopsTotal" value="0" readonly>
            </div>

            <div class="field">
                <label>🌍 מהירות שרת</label>
                <input value="3×" readonly>
            </div>

        </div>

    </section>


    <!-- VILLAGE -->

    <section class="card">

        <h2>🏠 פרטי הכפר</h2>

        <div class="grid">

            <div class="field">
                <label>שם הכפר</label>
                <input id="villageName" placeholder="לדוגמה: Gabriel">
            </div>

            <div class="field">
                <label>קואורדינטות</label>
                <input id="coordinates" placeholder="32|-174">
            </div>

            <div class="field">
                <label>אוכלוסייה</label>
                <input id="population" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>בירה?</label>

                <select id="isCapital">
                    <option value="false">לא</option>
                    <option value="true">כן</option>
                </select>

            </div>

        </div>

    </section>


    <!-- RESOURCES -->

    <section class="card">

        <h2>🌾 משאבים</h2>

        <div class="grid">

            <div class="field">
                <label>🪵 עץ</label>
                <input id="wood" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>🧱 טיט</label>
                <input id="clay" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>⛓️ ברזל</label>
                <input id="iron" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>🌾 יבול</label>
                <input id="crop" type="number" min="0" value="0">
            </div>

        </div>

    </section>


    <!-- PRODUCTION -->

    <section class="card">

        <h2>📈 ייצור לשעה</h2>

        <div class="grid">

            <div class="field">
                <label>🪵 עץ / שעה</label>
                <input id="woodProd" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>🧱 טיט / שעה</label>
                <input id="clayProd" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>⛓️ ברזל / שעה</label>
                <input id="ironProd" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>🌾 יבול / שעה</label>
                <input id="cropProd" type="number" min="0" value="0">
            </div>

        </div>

    </section>


    <!-- STORAGE -->

    <section class="card">

        <h2>📦 אחסון ויבול</h2>

        <div class="grid">

            <div class="field">
                <label>מחסן</label>
                <input id="warehouse" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>אסם</label>
                <input id="granary" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>צריכת יבול / שעה</label>
                <input id="cropConsumption" type="number" min="0" value="0">
            </div>

        </div>

    </section>


    <!-- TROOPS -->

    <section class="card">

        <h2>⚔️ צבא רומאי</h2>

        <div class="grid">

            <div class="field">
                <label>לגיונרים</label>
                <input id="legionnaire" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>פרטוריאנים</label>
                <input id="praetorian" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>אימפריאנים</label>
                <input id="imperian" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>Equites Legati</label>
                <input id="equitesLegati" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>Equites Imperatoris</label>
                <input id="equitesImperatoris" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>Equites Caesaris</label>
                <input id="equitesCaesaris" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>אילי ניגוח</label>
                <input id="ram" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>קטפולטות אש</label>
                <input id="fireCatapult" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>סנאטורים</label>
                <input id="senator" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>מתיישבים</label>
                <input id="settler" type="number" min="0" value="0">
            </div>

        </div>

    </section>


    <!-- HERO -->

    <section class="card">

        <h2>🦸 גיבור</h2>

        <div class="grid">

            <div class="field">
                <label>רמת גיבור</label>
                <input id="heroLevel" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>ניסיון</label>
                <input id="heroXP" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>חיים %</label>
                <input id="heroHealth" type="number" min="0" max="100" value="100">
            </div>

        </div>

    </section>


    <!-- BUILDINGS -->

    <section class="card">

        <h2>🏗️ מבנים</h2>

        <div class="grid">

            <div class="field">
                <label>בניין מרכזי</label>
                <input id="mainBuilding" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>מגורים מלכותיים</label>
                <input id="residence" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>אחוזת גיבור</label>
                <input id="heroMansion" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>קסרקטין</label>
                <input id="barracks" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>אורווה</label>
                <input id="stable" type="number" min="0" value="0">
            </div>

            <div class="field">
                <label>שוק</label>
                <input id="market" type="number" min="0" value="0">
            </div>

        </div>

        <div class="button-row">

            <button onclick="saveVillage()">
                💾 שמור כפר
            </button>

            <button
                onclick="clearForm()"
                class="secondary">
                🗑️ נקה
            </button>

        </div>

    </section>


    <!-- SAVED VILLAGES -->

    <section class="card">

        <h2>🏰 הכפרים שלי</h2>

        <div id="villagesContainer">

            <div class="empty">
                עדיין לא הוספת כפרים.
            </div>

        </div>

    </section>


    <!-- AI -->

    <section class="card">

        <h2>🧠 Travian AI</h2>

        <div class="ai-box">

            <strong>מנוע הניתוח מוכן.</strong>

            <p>
                לאחר הזנת הנתונים המערכת תוכל
                להתחיל לנתח את מצב החשבון.
            </p>

        </div>

    </section>

</main>


<script src="app.js"></script>

</body>
</html>
